name: Vote Service CI/CD

on:
  push:
    paths:
      - 'vote/**'
  pull_request:
    paths:
      - 'vote/**'

jobs:
  vote-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lint Tools
        run: |
          pip install flake8

      - name: Lint Vote Service
        run: |
          flake8 vote || true

      - name: Lint Kubernetes Manifests
        run: |
          find k8s-specifications -name "*.yaml" | while read file; do
            grep "apiVersion:" "$file"
            grep "kind:" "$file"
          done

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Vote Image
        run: |
          docker build -t starayush23/vote:${{ github.sha }} ./vote

      - name: Push Vote Image
        run: |
          docker push starayush23/vote:${{ github.sha }}

      - name: Create Kind Cluster
        uses: helm/kind-action@v1

      - name: Deploy Application
        run: |
          kubectl apply -f k8s-specifications/

      - name: Wait For Vote Deployment
        run: |
          kubectl rollout status deployment/vote --timeout=180s

      - name: Smoke Test Vote Service
        run: |
          kubectl port-forward svc/vote 8080:8080 &
          sleep 15
          curl -f http://localhost:8080
